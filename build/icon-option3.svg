<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cbcff"/>
      <stop offset="1" stop-color="#2b7fd0"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a66"/>
      <stop offset="1" stop-color="#26303f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- 2x2 video grid; top-left is the "audible" tile -->
  <rect x="16"  y="16"  width="234" height="234" rx="48" fill="url(#t1)"/>
  <rect x="262" y="16"  width="234" height="234" rx="48" fill="url(#t2)"/>
  <rect x="16"  y="262" width="234" height="234" rx="48" fill="url(#t2)"/>
  <rect x="262" y="262" width="234" height="234" rx="48" fill="url(#t2)"/>
  <!-- play symbol across all four -->
  <path d="M212 180 L334 256 L212 332 Z" fill="#ffffff" stroke="#ffffff" stroke-width="28" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
