<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24242c"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cbcff"/>
      <stop offset="1" stop-color="#2b7fd0"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a66"/>
      <stop offset="1" stop-color="#26303f"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="103.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- 2x2 video grid; top-left is the "audible" tile -->
  <rect x="80"  y="104" width="166" height="124" rx="22" fill="url(#t1)"/>
  <rect x="266" y="104" width="166" height="124" rx="22" fill="url(#t2)"/>
  <rect x="80"  y="248" width="166" height="124" rx="22" fill="url(#t2)"/>
  <rect x="266" y="248" width="166" height="124" rx="22" fill="url(#t2)"/>
  <!-- shared play button across all four -->
  <circle cx="256" cy="238" r="74" fill="#101014"/>
  <circle cx="256" cy="238" r="62" fill="#e8e8ea"/>
  <path d="M236 204 L290 238 L236 272 Z" fill="#101014" stroke="#101014" stroke-width="10" stroke-linejoin="round"/>
  <!-- global timeline -->
  <rect x="80" y="400" width="352" height="16" rx="8" fill="#3a4a66"/>
  <rect x="80" y="400" width="210" height="16" rx="8" fill="#3da9fc"/>
  <circle cx="290" cy="408" r="18" fill="#e8e8ea"/>
</svg>
