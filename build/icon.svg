<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cbcff"/>
      <stop offset="1" stop-color="#2b7fd0"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a66"/>
      <stop offset="1" stop-color="#26303f"/>
    </linearGradient>
  </defs>
  <!-- 2x2 video grid; top-left is the "audible" tile -->
  <rect x="16"  y="90"  width="234" height="160" rx="20" fill="url(#t1)"/>
  <rect x="262" y="90"  width="234" height="160" rx="20" fill="url(#t2)"/>
  <rect x="16"  y="262" width="234" height="160" rx="20" fill="url(#t2)"/>
  <rect x="262" y="262" width="234" height="160" rx="20" fill="url(#t2)"/>
  <!-- play symbol across all four -->
  <path d="M216 192 L318 256 L216 320 Z" fill="#ffffff" stroke="#ffffff" stroke-width="26" stroke-linejoin="round"/>
</svg>
