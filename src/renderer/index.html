<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ManyMovies</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="tiles" class="no-strips"></div>
        <div id="empty">
          <div class="empty-title">ManyMovies</div>
          <div>Drop video files here, or click ＋ to add them</div>
        </div>
      </div>
      <div id="controls">
        <button id="btn-add" title="Add videos">＋</button>
        <button id="btn-clear" title="Remove all videos" disabled>✕</button>
        <button id="btn-more" title="More controls" aria-expanded="false" aria-controls="extras">›</button>
        <div id="extras" inert>
          <div class="extras-inner">
            <button id="btn-back" title="Back 10s (←)">⏪ 10</button>
            <button id="btn-fwd" title="Forward 10s (→)">10 ⏩</button>
            <select id="rate" title="Playback speed (↑/↓)">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
            </select>
            <span class="sep"></span>
            <button id="btn-mute" title="Mute all (M)">🔊</button>
            <button id="btn-all" title="All videos audible (A)">All sound</button>
            <button id="btn-titles" title="Show/hide video titles (T)">Titles</button>
          </div>
        </div>
        <span class="sep"></span>
        <button id="btn-play" title="Play/Pause (Space)"><span>▶</span><span>⏸</span></button>
        <input id="slider" type="range" min="0" max="0" step="0.01" value="0" />
        <span id="time">0:00 / 0:00</span>
        <button id="btn-full" title="Full screen (F11)">⛶</button>
      </div>
      <input id="file-input" type="file" accept="video/*" multiple hidden />
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
