<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ManyMovies</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="tiles" class="no-strips"></div>
        <div id="empty">
          <div class="empty-title">ManyMovies</div>
          <div>Drop video files here, or click <span class="inline-icon" data-icon="plus"></span> to add them</div>
        </div>
      </div>
      <div id="controls">
        <button id="btn-add" title="Add videos" data-icon="plus"></button>
        <button id="btn-clear" title="Remove all videos" disabled data-icon="x"></button>
        <button id="btn-more" title="More controls" aria-expanded="false" aria-controls="extras" data-icon="chevron-right"></button>
        <div id="extras" inert>
          <div class="extras-inner">
            <button id="btn-back" title="Back 10s (←)" data-icon="back-10"></button>
            <button id="btn-fwd" title="Forward 10s (→)" data-icon="fwd-10"></button>
            <select id="rate" title="Playback speed (↑/↓)">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
            </select>
            <span class="sep"></span>
            <button id="btn-mute" title="Mute all (M)" data-icon="volume"></button>
            <button id="btn-all" title="All videos audible (A)">All sound</button>
            <button id="btn-cycle" title="Cycle audio through the videos, one at a time" data-icon="cycle"></button>
            <select id="cycle-interval" title="Time each video is heard while cycling">
              <option value="5">5s</option>
              <option value="10" selected>10s</option>
              <option value="20">20s</option>
              <option value="30">30s</option>
              <option value="60">60s</option>
            </select>
            <button id="btn-titles" title="Show/hide video titles (T)">Titles</button>
          </div>
        </div>
        <span class="sep"></span>
        <button id="btn-play" title="Play/Pause (Space)" data-icon="play"></button>
        <input id="slider" type="range" min="0" max="0" step="0.01" value="0" />
        <span id="time">0:00 / 0:00</span>
        <button id="btn-full" title="Full screen (F11)" data-icon="maximize"></button>
      </div>
      <input id="file-input" type="file" accept="video/*" multiple hidden />
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
